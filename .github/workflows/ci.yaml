name: CI workflow for product catalog
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build
        run: |
          cd src/product-catalog
          go mod download  
          go build -o product-catalog main.go

      - name: Run tests
        run: |
          cd src/product-catalog
          go test -v ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: set up go
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Run code quality checks lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          run: golangci-lint run
          working-directory: src/product-catalog
  
  docker-build:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install docker
        uses: docker/setup-buildx-action@v2
      
      - name: login into docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME }}
          password: ${{secrets.DOCKER_PASSWORD }}
      
      - name: build and push docker image
        uses: docker/build-push-action@v3
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}
  
  update K8s:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.Git hub PAT token}}

      - name: update tag in k8s manifest deployment of product catalog
        run: 
          sed -i "s|image: .*|image: ${{secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog-deploy.yaml
      - name: commit and push changes to Githud repository
        run: |
          git config --global user.name "anithaanthati-sudo"
          git config --global user.email "anitha.anthati@gmail.com"
          git add kubernetes/productcatalog-deploy.yaml
          git commit -m "Update product catalog image tag to ${{github.run_id}}"
          git push origin main
  deploy:
    needs: update K8s
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}    

      - name: install kubectl
        uses: aws/setup-kubectl@v4
       
      - name: update kubeconfig
        uses: aws-actions/eks-update-kubeconfig@v1
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: deploy to EKS cluster
        uses: aws-actions/eks-kubectl@v1
        run: |
          kubectl apply -f kubernetes/productcatalog-deploy.yaml
